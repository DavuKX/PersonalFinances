apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: personal-finance
  labels:
    app: transaction-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: davukx/finance-transaction-service:1.1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: transaction-service-config
            - secretRef:
                name: db-secrets
            - secretRef:
                name: jwt-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
